dns:
  enable: true
  listen: :53
  ipv6: true
  prefer-h3: false
  use-hosts: false
  use-system-hosts: false
  respect-rules: false

  # 底层解析 DNS → 只留国内，绝对不能加国外IP
  default-nameserver:
    - 223.5.5.5
    - 223.6.6.6

  # 真正上网解析 DNS → 国内加密，稳定不污染
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query

  # 代理节点解析用
  proxy-server-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query

  # 关键！macOS 开Tun必须用 redir-host，fake-ip 必出问题
  enhanced-mode: redir-host

  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - '*.lan'
    - '*.local'
    - '*.arpa'
    - time.*.com
    - ntp.*.com
    - +.market.xiaomi.com
    - localhost.ptlogin2.qq.com
    - '*.msftncsi.com'
    - www.msftconnecttest.com
  fake-ip-filter-mode: blacklist

  # 以下保持你原来的，不动
  direct-nameserver: []
  direct-nameserver-follow-policy: false
  fallback: []
  fallback-filter:
    domain:
      - +.google.com
      - +.facebook.com
      - +.youtube.com
    geoip: true
    geoip-code: CN
    ipcidr:
      - 240.0.0.0/4
      - 0.0.0.0/32
