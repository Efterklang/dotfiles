map_timeout 1.2
map cmd+shift+p command_palette

# Prefix key (tmux: C-g). Mode stays open so hjkl resize can be chained;
# exits via Esc, any unbound key, or any single-shot binding that pops explicitly.
map --new-mode tmux_prefix --on-unknown end ctrl+g
map --mode tmux_prefix esc pop_keyboard_mode
map --mode tmux_prefix r combine : load_config_file : pop_keyboard_mode
map --mode tmux_prefix d combine : kitten kitty-tmux-menu.py : pop_keyboard_mode

# Pane navigation
map alt+h neighboring_window left
map alt+j neighboring_window down
map alt+k neighboring_window up
map alt+l neighboring_window right

# Pane (kitty window) management
map --mode tmux_prefix | combine : launch --location=vsplit --cwd=current : pop_keyboard_mode
map --mode tmux_prefix - combine : launch --location=hsplit --cwd=current : pop_keyboard_mode
map --mode tmux_prefix x combine : close_window : pop_keyboard_mode

# Pane resize. hjkl moves the border in that direction (tmux-style:
# grows or shrinks the active pane based on which side of the border it's on).
map --mode tmux_prefix h kitten kitty-tmux-resize.py left
map --mode tmux_prefix j kitten kitty-tmux-resize.py down
map --mode tmux_prefix k kitten kitty-tmux-resize.py up
map --mode tmux_prefix l kitten kitty-tmux-resize.py right

# Tab management. Prefix uses [ / ] so hjkl stays free for resize.
map alt+a previous_tab
map alt+d next_tab
map --mode tmux_prefix n combine : new_tab_with_cwd : pop_keyboard_mode
map --mode tmux_prefix [ combine : previous_tab : pop_keyboard_mode
map --mode tmux_prefix ] combine : next_tab : pop_keyboard_mode

# Popup-like overlays (tmux popup replacement, via new tab)
# Prepend Homebrew paths for shortcut-launched tools and their child commands.
action_alias popup_lazygit launch --copy-env --env PATH=/opt/homebrew/bin:/opt/homebrew/sbin:$PATH --cwd=current --type=tab --tab-title lazygit lazygit
action_alias popup_btop launch --copy-env --env PATH=/opt/homebrew/bin:/opt/homebrew/sbin:$PATH --cwd=current --type=tab --tab-title btop btop
action_alias popup_rmpc launch --copy-env --env PATH=/opt/homebrew/bin:/opt/homebrew/sbin:$PATH --cwd=current --type=tab --tab-title rmpc rmpc
action_alias popup_yazi launch --copy-env --env PATH=/opt/homebrew/bin:/opt/homebrew/sbin:$PATH --cwd=current --type=tab --tab-title yazi yazi
map alt+g popup_lazygit
map alt+m popup_rmpc
map alt+y popup_yazi
map --mode tmux_prefix g combine : popup_lazygit : pop_keyboard_mode
map --mode tmux_prefix T combine : popup_btop : pop_keyboard_mode
map --mode tmux_prefix m combine : popup_rmpc : pop_keyboard_mode
map --mode tmux_prefix y combine : popup_yazi : pop_keyboard_mode
