# Font
font_family          Maple Mono NF CN
bold_font            Maple Mono NF CN Bold
italic_font          Maple Mono NF CN Italic
bold_italic_font     Maple Mono NF CN Bold Italic
font_features        MapleMono-NF-CN              +cv01 +ss02 +ss04 +ss05 +zero
font_features        MapleMono-NF-CN-Bold         +cv01 +ss02 +ss04 +ss05 +zero
font_features        MapleMono-NF-CN-Italic       +cv01 +ss02 +ss04 +ss05 +zero
font_features        MapleMono-NF-CN-BoldItalic   +cv01 +ss02 +ss04 +ss05 +zero
font_size            14.0

# Cursor
cursor_trail 3

# Window
initial_window_width           640
initial_window_height          400
window_padding_width           6
single_window_padding_width    14
window_margin_width            0
window_border_width            1pt
draw_minimal_borders           yes
inactive_text_alpha            0.88
placement_strategy             center
remember_window_size           yes
hide_window_decorations        titlebar-only
confirm_os_window_close        0

# macOS
macos_titlebar_color                background
macos_option_as_alt                 yes
macos_quit_when_last_window_closed  yes
macos_menubar_title_max_length      0

# Clipboard
copy_on_select clipboard

# Remote control
allow_remote_control socket-only
listen_on            unix:/tmp/kitty

# Tab bar - tmux-style status line (Catppuccin Mocha)
tab_bar_edge                top
tab_bar_style               separator
tab_bar_align               center
tab_bar_min_tabs            1
tab_bar_margin_height       2.0 2.0
tab_separator               " │ "
tab_title_template          " {title[:24]} "
active_tab_title_template   " {title[:24]} "

# Splits as default so split bindings behave predictably
enabled_layouts splits:split_axis=horizontal stack grid tall horizontal

include keymap.conf
include mocha.conf

# Tab bar colour overrides — flat, transparent, tmux-inspired
active_tab_foreground       #cba6f7
active_tab_background       #1e1e2e
active_tab_font_style       bold
inactive_tab_foreground     #cdd6f4
inactive_tab_background     #1e1e2e
inactive_tab_font_style     normal
tab_bar_background          none
