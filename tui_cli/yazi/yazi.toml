# A TOML linter such as https://taplo.tamasfe.dev/ can use this schema to validate your config.
# If you encounter any issues, please make an issue at https://github.com/yazi-rs/schemas.

[mgr]
linemode = "size"
ratio = [1, 4, 3]
scrolloff = 5
show_hidden = true
show_symlink = true
sort_by = "alphabetical"
sort_dir_first = true
sort_reverse = false
sort_sensitive = false

[preview]
cache_dir = ""
image_filter = "triangle"
image_quality = 60
max_height = 2000
max_width = 2000
tab_size = 2
ueberzug_offset = [0, 0, 0, 0]
ueberzug_scale = 1

[opener]
edit = [
  { run = "$EDITOR %s", block = true, for = "unix" },
  { run = "%EDITOR% %s", block = true, for = "windows" },
]
code = [{ run = 'code %s', orphan = true, desc = "VSCode" }]
extract = [{ run = 'unar %s', desc = "Extract here" }]
open = [
  { run = 'xdg-open %s', desc = "Open", for = "linux" },
  { run = 'open %s', desc = "Open", for = "macos" },
  { run = 'start "" %s', orphan = true, desc = "Open", for = "windows" },
]
icat = [
  { run = '''clear; kitten icat --hold --stdin=no --scale-up --align=center -- %s''', block = true, desc = "Preview fullscreen (kitty icat)", for = "unix" },
]
play = [
  { run = 'mpv %s', orphan = true },
  { run = '''mediainfo %s; echo "Press enter to exit"; read _''', block = true, desc = "Show media info", for = "unix" },
]
reveal = [
  { run = 'xdg-open "$(dirname %s)"', desc = "Reveal", for = "linux" },
  { run = 'open -R %s', desc = "Reveal", for = "macos" },
  { run = 'explorer /select, %s', orphan = true, desc = "Reveal", for = "windows" },
  { run = '''exiftool %s; echo "Press enter to exit"; read _''', block = true, desc = "Show EXIF", for = "unix" },
]
upload = [{ run = 'rclone copy %s bit_s4:vluv-space', desc = "Upload File To Bitiful Bucket" }]

[open]
rules = [
  { mime = "text/*", use = [
    "edit",
    "reveal",
  ] },
  { mime = "image/*", use = [
    "icat",
    "open",
    "reveal",
    "upload",
  ] },
  { mime = "{audio,video}/*", use = [
    "play",
    "reveal",
    "upload",
  ] },
  { mime = "inode/x-empty", use = [
    "edit",
    "reveal",
  ] },
  { mime = "application/*zip", use = [
    "extract",
    "reveal",
  ] },
  { mime = "application/x-{tar,bzip*,7z-compressed,xz,rar}", use = [
    "extract",
    "reveal",
  ] },
  { mime = "application/json", use = [
    "edit",
    "reveal",
  ] },
  { mime = "*/javascript", use = [
    "edit",
    "reveal",
  ] },
  { mime = "*", use = [
    "open",
    "edit",
    "reveal",
    "code",
  ] },
]

[tasks]
bizarre_retry = 5
image_alloc = 536870912  # 512MB
image_bound = [0, 0]
macro_workers = 25
micro_workers = 10
suppress_preload = false

[input]
# cd
cd_offset = [0, 2, 50, 3]
cd_origin = "top-center"
cd_title = "Change directory:"

# create
create_offset = [0, 2, 50, 3]
create_origin = "top-center"
create_title = ["Create:", "Create (dir):"]

# rename
rename_offset = [0, 1, 50, 3]
rename_origin = "hovered"
rename_title = "Rename:"

# trash
trash_offset = [0, 2, 50, 3]
trash_origin = "top-center"
trash_title = "Move {n} selected file{s} to trash? (y/N)"

# delete
delete_offset = [0, 2, 50, 3]
delete_origin = "top-center"
delete_title = "Delete {n} selected file{s} permanently? (y/N)"

# filter
filter_offset = [0, 2, 50, 3]
filter_origin = "top-center"
filter_title = "Filter:"

# find
find_offset = [0, 2, 50, 3]
find_origin = "top-center"
find_title = ["Find next:", "Find previous:"]

# search
search_offset = [0, 2, 50, 3]
search_origin = "top-center"
search_title = "Search via {n}:"

# shell
shell_offset = [0, 2, 50, 3]
shell_origin = "top-center"
shell_title = ["Shell:", "Shell (block):"]

# overwrite
overwrite_offset = [0, 2, 50, 3]
overwrite_origin = "top-center"
overwrite_title = "Overwrite an existing file? (y/N)"

# quit
quit_offset = [0, 2, 50, 3]
quit_origin = "top-center"
quit_title = "{n} task{s} running, sure to quit? (y/N)"

[which]
sort_by = "none"
sort_reverse = false
sort_sensitive = false

[plugin]
prepend_preloaders = [
  # Replace magick, image, video with mediainfo
  { mime = "{audio,video,image}/*", run = "mediainfo" },
  { mime = "application/subrip", run = "mediainfo" },
]

prepend_previewers = [
  # Replace magick, image, video with mediainfo
  { mime = "{audio,video,image}/*", run = "mediainfo" },
  { mime = "application/subrip", run = "mediainfo" },
  { url = "*/", run = 'piper -- eza -TL=3 --color=always --icons=always --group-directories-first --no-quotes "$1"' }, # Preview directory tree with eza
  { url = "*.{md,mdx}", run = 'piper -- CLICOLOR_FORCE=1 glow -w=$w -s=dark "$1"' },                                   # Preview markdown with glow
]

prepend_fetchers = [
  { id = "mime", group = "mime", url = "local:///Users/gjx/Library/CloudStorage/OneDrive-Personal/**/*.{mp4,mkv,mov,avi,wmv,...}", run = "noop", prio = "high" },
  { id = "mime", group = "mime", url = "local://*", run = "mime-ext.local", prio = "high" },
  { id = "mime", group = "mime", url = "remote://*", run = "mime-ext.remote", prio = "high" },
]
